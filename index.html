<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script type="module" src="src/js/main.js"></script>

		<title>Dan's Portfolio</title>
	</head>

	<body class="y-centered-flex-col min-h-dvh w-full gap-10 bg-gray-nurse-200">
		<header
			x-data="nav"
			id="navigation"
			class="w-11/12 py-5 md:w-10/12 lg:w-4/5 xl:w-3/4 2xl:w-1/2"
		>
			<!-- Nav for large screens -->
			<nav id="large-nav" class="nav">
				<a href="#profile" id="large-nav-link" class="nav-link">
					Profile
				</a>

				<a href="#projects" id="large-nav-link" class="nav-link">
					Projects
				</a>

				<a href="#demos" id="large-nav-link" class="nav-link">
					Demos
				</a>

				<a href="#contact" id="large-nav-link" class="nav-link">
					Contact
				</a>
			</nav>

			<!-- Menu button -->
			<div
				class="flex w-full flex-row items-center justify-end lg:hidden"
			>
				<button
					x-on:click="toggle = !toggle"
					type="button"
					class="rounded-lg bg-gray-nurse-50 px-2 py-1 transition-all hover:bg-gray-nurse-300 active:bg-gray-nurse-400"
				>
					<svg
						x-show="toggle === false"
						x-cloak
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						fill="currentColor"
						class="size-6 fill-chicago-700"
					>
						<path
							fill-rule="evenodd"
							d="M2.25 4.5A.75.75 0 0 1 3 3.75h14.25a.75.75 0 0 1 0 1.5H3a.75.75 0 0 1-.75-.75Zm0 4.5A.75.75 0 0 1 3 8.25h9.75a.75.75 0 0 1 0 1.5H3A.75.75 0 0 1 2.25 9Zm15-.75A.75.75 0 0 1 18 9v10.19l2.47-2.47a.75.75 0 1 1 1.06 1.06l-3.75 3.75a.75.75 0 0 1-1.06 0l-3.75-3.75a.75.75 0 1 1 1.06-1.06l2.47 2.47V9a.75.75 0 0 1 .75-.75Zm-15 5.25a.75.75 0 0 1 .75-.75h9.75a.75.75 0 0 1 0 1.5H3a.75.75 0 0 1-.75-.75Z"
							clip-rule="evenodd"
						/>
					</svg>

					<svg
						x-show="toggle === true"
						x-cloak
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						fill="currentColor"
						class="size-6 fill-chicago-700"
					>
						<path
							fill-rule="evenodd"
							d="M2.25 4.5A.75.75 0 0 1 3 3.75h14.25a.75.75 0 0 1 0 1.5H3a.75.75 0 0 1-.75-.75Zm14.47 3.97a.75.75 0 0 1 1.06 0l3.75 3.75a.75.75 0 1 1-1.06 1.06L18 10.81V21a.75.75 0 0 1-1.5 0V10.81l-2.47 2.47a.75.75 0 1 1-1.06-1.06l3.75-3.75ZM2.25 9A.75.75 0 0 1 3 8.25h9.75a.75.75 0 0 1 0 1.5H3A.75.75 0 0 1 2.25 9Zm0 4.5a.75.75 0 0 1 .75-.75h5.25a.75.75 0 0 1 0 1.5H3a.75.75 0 0 1-.75-.75Z"
							clip-rule="evenodd"
						/>
					</svg>
				</button>
			</div>

			<!-- Nav for mobile -->
			<nav
				x-show="toggle"
				x-cloak
				x-transition
				id="mobile-nav"
				class="nav"
			>
				<a href="#profile" id="mobile-nav-link" class="nav-link">
					Profile
				</a>

				<a href="#projects" id="mobile-nav-link" class="nav-link">
					Projects
				</a>

				<a href="#demos" id="mobile-nav-link" class="nav-link">
					Demos
				</a>

				<a href="#contact" id="mobile-nav-link" class="nav-link">
					Contact
				</a>
			</nav>
		</header>

		<main
			x-data="cards"
			class="y-centered-flex-col w-11/12 shrink-0 grow gap-10 py-5 md:w-10/12 lg:w-4/5 xl:w-3/4 2xl:w-1/2"
		>
			<!-- Profile -->
			<section 
				id="profile" 
				class="main-content-section"
			>
				<section class="y-start-flex-col gap-2 self-start">
					<template x-for="(value, index) in profileData.details">
						<div class="block">
							<div 
								x-bind:id="index"
								x-text="value"
							></div>
						</div>
					</template>
				</section>

				<!-- Mockup Terminal -->
				<section class="size-full rounded-lg bg-blue-smoke-800 shadow-md shadow-blue-smoke-500 transition-all hover:shadow-lg hover:shadow-blue-smoke-700">
					<!-- Window Buttons -->
					<section class="x-end-flex-row h-fit w-full gap-4 rounded-t-lg bg-chicago-950 p-2">
						<template x-for="icon in profileData.mockupTerminal.icons">
							<div x-html="icon"></div>
						</template>
					</section>

					<!-- Terminal -->
					<section class="y-start-flex-col gap-5 p-5 text-chicago-100">
						<template x-for="(value, index) in profileData.mockupTerminal.content">
							<div>
								<p 
									class="terminal-text"
									x-html="value.title"	
								></p>

								<div class="terminal-output">
									[
										<template x-for="(innerValue, innerIndex) in value.list">
											<span class="terminal-output" x-html="terminalList(value.list, innerIndex, innerValue)"></span>
										</template>
									]
								</div>
							</div>
						</template>

						<div>
							<p id="terminal-cursor" class="terminal-text">
								>&nbsp;
							</p>
						</div>
					</section>
				</section>
			</section>

			<!-- Projects -->
			<section 
				id="projects" 
				class="main-content-section"
			>
				<p class="three-xl-title">Projects</p>

				<template x-for="data in projectData">
					<div class="card">
						<img
							x-bind:src="data.image.src"
							x-bind:alt="data.image.alt"
							class="card-image"
						/>

						<div class="card-content">
							<p 
								class="xl-title" 
								x-text="data.content.title"
							></p>

							<p 
								class="card-description" 
								x-html="data.content.description"
							></p>

							<div class="card-badges">
								<template x-for="(value, index) in data.content.badges">
									<div 
										x-bind:class="badgeColor(value)"
										x-text="badgeText(index)"
									></div>
								</template>
							</div>
						</div>							
					</div>
				</template>
			</section>

			<!-- Demos -->
			<section 
				id="demos" 
				class="main-content-section"
			>
				<p class="three-xl-title">Demos</p>

				<template x-for="data in demoData">
					<div class="card">
						<img 
							x-bind:src="data.image.src" 
							x-bind:alt="data.image.alt" 
							class="card-image" 
						/>
	
						<div class="card-content">
							<p 
								class="xl-title" 
								x-text="data.content.title"
							></p>

							<p 
								class="card-description" 
								x-html="data.content.description"
							></p>
	
							<div class="card-badges">
								<template x-for="(value, index) in data.content.badges">
									<div 
										x-bind:class="badgeColor(value)"
										x-text="badgeText(index)"
									></div>
								</template>
							</div>
	
							<!-- Buttons -->
							<div class="card-buttons">
								<template x-for="button in data.links">
									<a 
										x-bind:href="button.link" 
										x-bind:target="button.target" 
										x-html="button.content"
										class="link-button"
									></a>
								</template>
							</div>
						</div>
					</div>
				</template>
			</section>
		</main>

		<footer
			x-data="footerData"
			id="contact"
			class="y-centered-flex-col w-11/12 gap-5 py-5 md:w-10/12 lg:w-4/5 xl:w-3/4 2xl:w-1/2"
		>
			<!-- Socials -->
			<section class="x-centered-flex-row gap-5 xl:gap-10">
				<template x-for="item in data.socials">
					<a
						x-bind:href="item.href"
						x-bind:target="item.target"
						class="contact-link group"
					>
						<div x-html="item.icon"></div>
						<p class="contact-link-text" x-text="item.linkText"></p>
					</a>
				</template>
			</section>

			<!-- Credit -->
			<section class="x-centered-flex-row gap-1">
				<p class="credit-text" x-text="data.credit.name"></p>
				<div x-html="data.credit.icon"></div>
				<p class="credit-text" x-text="data.credit.date"></p>
			</section>
		</footer>
	</body>
</html>
